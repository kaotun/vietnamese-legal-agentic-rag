[project]
name = "legal-qa-backend"
version = "0.1.0"
description = "Hệ thống Trợ lý Hỏi đáp Pháp luật Việt Nam - Backend v3.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.4",
    "ipykernel>=6.29.4",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "rank-bm25>=0.2.2",
    "openai>=1.35.0",
    "underthesea>=6.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
